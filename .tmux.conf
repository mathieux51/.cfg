set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g mouse on

# Use Vim shortcuts
setw -g mode-keys vi
# (pane navigation h/j/k/l is defined once, with repeat, further down)
# bind-key -r C-h select-window -t :-
# bind-key -r C-l select-window -t :+

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

# remove confirmation when closing window
bind-key & kill-window

# remove administrative debris (session name, hostname, time) in status bar
# set -g status-left ''
# set -g status-right ''

# increase scrollback lines
set -g history-limit 1000000

set -s escape-time 10                     # faster command sequences
set -sg repeat-time 600                   # increase repeat timeout
set -s focus-events on


unbind-key C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# set-option -g prefix C-a
# bind-key C-a send-prefix
set -g prefix2 C-a                        # GNU-Screen compatible prefix
bind C-a send-prefix -2

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 1000 # slightly longer pane indicators display time
set -g display-time 2000      # slightly longer status messages display time

# activity
set -g monitor-activity on
set -g visual-activity off

# split current window horizontally
bind - split-window -v -c "#{pane_current_path}"
# split current window vertically
bind _ split-window -h -c "#{pane_current_path}"
# new windows inherit the current pane's directory
bind c new-window -c "#{pane_current_path}"

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# bind Tab last-window        # move to last active window

bind b list-buffers  # list paste buffers
bind p paste-buffer  # paste from the top paste buffer
bind P choose-buffer # choose which buffer to paste from

# reload config file
bind r source-file ~/.tmux.conf \; display "source-file ~/.tmux.conf"
# set -g @continuum-restore 'on'

set -g @plugin "arcticicestudio/nord-tmux"
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Must come AFTER tpm: nord-tmux forces status-interval 1 (redraw every second,
# which stutters input). Override it back to a calmer cadence.
set -g status-interval 5

# Speak the selection aloud (~/.local/bin/speak). macOS's own Option+Esc can't
# do this here: WezTerm exposes no accessibility text, so the selection has to
# be handed to `say` explicitly. Press again while it's talking to stop.
# In copy-mode: select with v + motions, then S.
bind-key -T copy-mode-vi S send-keys -X copy-pipe-and-cancel "~/.local/bin/speak"
# Outside copy-mode: prefix+S speaks the last selection (the MouseDragEnd1Pane
# binding above already copies a plain mouse drag into the buffer).
bind-key S run-shell -b "tmux save-buffer - 2>/dev/null | ~/.local/bin/speak"
